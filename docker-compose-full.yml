services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - imsy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 10
  migrate:
    image: ghcr.io/pococze/imsy:${IMSY_APP_VERSION_TAG}
    command: ["migrate"]
    environment:
      INC_DB_CONN: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  imsy:
    image: ghcr.io/pococze/imsy:${IMSY_APP_VERSION_TAG}
    environment:
      # All data are temporarily stored in memory, no database needed if TRUE
      INC_DEV_MODE: ${DEV_MODE}
      INC_HTTP_PORT: 8080

      # Below is required if INC_DEV_MODE=false;
      INC_DB_CONN: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      # Generated using: openssl rand -base64 32
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # TRANSPORT_ENCRYPTION_KEY: ${TRANSPORT_ENCRYPTION_KEY}
      HMAC_ENCRYPTION_KEY: ${HMAC_ENCRYPTION_KEY}

      # optional: specify UUIDv7, otherwise will be generated on each startup new unique one, example:
      INC_ORG_ID: ${ORG_ID}
      INC_USER_ID: ${USER_ID}
    restart: unless-stopped
    ports:
      - 8080:8080
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  imsy_pgdata: